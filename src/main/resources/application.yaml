spring:
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  cache:
    cache-names:
      - iam.effective-permissions
  session:
    timeout: 8h
    data:
      redis:
        namespace: finaxis:platform:sessions

sentry:
  enabled: false
  dsn: ""

finaxis:
  iam:
    active-organisation-context:
      secret: "local-development-active-organisation-context-secret"
      ttl: 8h

springdoc:
  swagger-ui:
    path: /docs
