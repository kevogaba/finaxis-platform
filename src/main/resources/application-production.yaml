server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict

spring:
  devtools:
    restart:
      enabled: false
  docker:
    compose:
      enabled: false
  data:
    redis:
      username: ${FINAXIS_REDIS_USERNAME}
      password: ${FINAXIS_REDIS_PASSWORD}
  mail:
    # Host, port and credentials come from application.yaml (FINAXIS_SMTP_*); production always
    # authenticates and upgrades the connection with STARTTLS.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jobrunr:
  dashboard:
    enabled: false

sentry:
  enabled: ${FINAXIS_SENTRY_ENABLED:true}
  dsn: ${FINAXIS_SENTRY_DSN:}
  environment: ${FINAXIS_DEPLOYMENT_ENVIRONMENT:production}

finaxis:
  iam:
    active-organisation-context:
      secret: ${FINAXIS_ACTIVE_ORGANISATION_CONTEXT_SECRET}
  security:
    cors:
      enabled: true
      allowed-origins: ${FINAXIS_CORS_ALLOWED_ORIGINS}
    headers:
      hsts-enabled: true
      content-security-policy: "default-src 'none'"
    protected-resource:
      # The public https origin (recommended). Unset: one startup WARN, and the metadata names the
      # origin each request arrived with (through the trusted-proxy list); never the local
      # http://localhost default. A set but invalid value fails startup.
      resource: ${FINAXIS_PROTECTED_RESOURCE_URL:}
