server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict

spring:
  devtools:
    restart:
      enabled: false
  docker:
    compose:
      enabled: false
  mail:
    host: ${FINAXIS_SMTP_HOST}
    port: ${FINAXIS_SMTP_PORT}
    username: ${FINAXIS_SMTP_USERNAME}
    password: ${FINAXIS_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

jobrunr:
  dashboard:
    enabled: false

finaxis:
  email:
    enabled: true
    from-address: ${FINAXIS_EMAIL_FROM_ADDRESS}
    app-base-url: ${FINAXIS_EMAIL_APP_BASE_URL}
  iam:
    active-organisation-context:
      secret: ${FINAXIS_ACTIVE_ORGANISATION_CONTEXT_SECRET}
  security:
    cors:
      enabled: true
      allowed-origins: ${FINAXIS_CORS_ALLOWED_ORIGINS}
    headers:
      hsts-enabled: true
      content-security-policy: "default-src 'none'"
