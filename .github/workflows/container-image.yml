name: Container Image

# Only what lands on main. An unfiltered `push:` rebuilt the image on every branch of every
# stacked pull request, which spends runner minutes proving something the branch's own quality
# gate already proves, and publishes nothing anyone consumes.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-image:
    # The JVM image is what CI can actually build. Both variants are AOT-processed and both are
    # deployable; the native one is a separate, manually triggered job below, for reasons its
    # comment explains. This job pushes the image it builds to GHCR under a fixed floating tag
    # (`main-jvm`) and an immutable per-run one (`sha-<short-sha>-run<run-number>-jvm`); a Coolify
    # deployment tracks the floating tag.
    #
    # Restricted to `refs/heads/main` even though `workflow_dispatch` has no branch filter of its
    # own: an unguarded job would let a manual dispatch against a feature branch push that
    # branch's code under the `main-jvm` tag Coolify tracks, deploying unmerged work. This does not
    # break the documented "flip a repo variable, re-run the workflow" mechanism for the switches
    # below - re-running a previous push-triggered run keeps its original `main` ref - it only
    # blocks a *fresh* dispatch against some other branch.
    if: github.ref == 'refs/heads/main'
    name: jvm image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build the JVM image
        env:
          FINAXIS_NATIVE_IMAGE: 'false'
          # A fixed name, independent of build.gradle.kts's `project.version` - the push step below
          # tags and pushes this exact reference, and pinning it here means a version bump there
          # can never desync the two.
          FINAXIS_IMAGE_NAME: ghcr.io/finaxis/platform:ci-build-jvm
          # Observability infra (otel-lgtm) is back online, so every signal defaults to on; each
          # falls back to 'true' only when no repo variable overrides it, so turning one off later
          # is a `vars.*` change in the repo settings, not a workflow edit.
          FINAXIS_OTEL_ENABLED: ${{ vars.FINAXIS_OTEL_ENABLED || 'true' }}
          FINAXIS_OTEL_TRACES_ENABLED: ${{ vars.FINAXIS_OTEL_TRACES_ENABLED || 'true' }}
          FINAXIS_OTEL_METRICS_ENABLED: ${{ vars.FINAXIS_OTEL_METRICS_ENABLED || 'true' }}
          FINAXIS_OTEL_LOGS_ENABLED: ${{ vars.FINAXIS_OTEL_LOGS_ENABLED || 'true' }}
          # Off by default, matching this property's own default - see
          # docs/operations/native-image-deployment.md. Enabling it needs real Keycloak admin
          # client credentials supplied to the deployment too, so this is a decision for whoever
          # owns that Coolify inventory, not something this workflow assumes.
          FINAXIS_KEYCLOAK_ADMIN_ENABLED: ${{ vars.FINAXIS_KEYCLOAK_ADMIN_ENABLED || 'false' }}
        run: ./gradlew --no-daemon bootBuildImage

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        # $GITHUB_RUN_NUMBER is one of the environment variables every run gets for free - no
        # `${{ }}` expression needed - which keeps this a plain bash step.
        id: tags
        run: |
          SHA_SHORT="$(git rev-parse --short HEAD)"
          {
            echo "sha_tag=ghcr.io/finaxis/platform:sha-${SHA_SHORT}-run${GITHUB_RUN_NUMBER}-jvm"
            echo "floating_tag=ghcr.io/finaxis/platform:main-jvm"
          } >> "$GITHUB_OUTPUT"

      - name: Push the JVM image to GHCR
        # There is no Dockerfile in this repo - bootBuildImage's Cloud Native Buildpacks build
        # straight into the local Docker daemon, so by this point the image already exists
        # locally under the fixed `FINAXIS_IMAGE_NAME` above. These two `docker tag`/`docker push`
        # pairs add the references Coolify actually deploys from, rather than building anything
        # again via docker/build-push-action the way a Dockerfile-based project would.
        #
        # The SHA tag also carries the run number: the documented outage/rebuild procedure is
        # re-running this workflow for the *same* commit with different repository variables, and
        # without a run-specific suffix that second push would silently overwrite the first
        # build's rollback tag with different behaviour under the same name.
        env:
          SOURCE_IMAGE: ghcr.io/finaxis/platform:ci-build-jvm
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          FLOATING_TAG: ${{ steps.tags.outputs.floating_tag }}
        run: |
          docker tag "$SOURCE_IMAGE" "$SHA_TAG"
          docker push "$SHA_TAG"
          docker tag "$SOURCE_IMAGE" "$FLOATING_TAG"
          docker push "$FLOATING_TAG"

      - name: Report the built image
        run: docker images ghcr.io/finaxis/platform --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  native-image:
    # Manual only, because a GitHub-hosted standard runner cannot build it.
    #
    # This is measured, not assumed. Two runs on `ubuntu-latest` both ended in
    # `The Native Image build process ran out of memory`: the first after 28 minutes, the second
    # after 37 even with `-Ob` quick-build mode and a 12 GB swapfile, that one having completed the
    # whole reachability analysis (66,380 types reachable) before dying while writing the image. The
    # runner reports `6.29GB of memory (75.6% of system memory, in container)` and two cores; the
    # same build on a 15 GB developer machine peaks at 8.09 GB, above the runner's entire budget.
    # Swap does not close it, because the failure is a Java heap exhaustion inside native-image
    # rather than the kernel reclaiming pages.
    #
    # So the native image is verified locally and by the deployment documentation instead - see
    # docs/operations/native-image-deployment.md, which covers both `bootBuildImage` for a container
    # and `nativeCompile` for a bare binary. Triggering this job is worthwhile only on a runner with
    # more memory; on a standard one it will fail the same way, after roughly half an hour.
    name: native image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Reclaim runner disk
        # The native build pulls the Paketo builder, downloads the Liberica NIK toolchain inside
        # the build container and writes a ~750 MB image. Disk is not what stops this job, but it
        # is tight enough to be worth reclaiming anyway.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build the native image
        env:
          FINAXIS_NATIVE_IMAGE: 'true'
          # Quick build: less memory and time than the optimising compile, and it still runs the
          # whole reachability analysis, which is the part that catches a missing hint.
          FINAXIS_NATIVE_BUILD_ARGS: '-Ob'
        run: ./gradlew --no-daemon bootBuildImage

      - name: Report the built image
        run: docker images ghcr.io/finaxis/platform --format '{{.Repository}}:{{.Tag}} {{.Size}}'
