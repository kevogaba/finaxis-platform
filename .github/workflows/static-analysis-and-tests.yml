name: Static Analysis, Qodana, and Jacoco Verification

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    name: Qodana
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: true
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'

  # The quality gate is split into parallel jobs so its slowest part, the test suite, runs on
  # several runners at once: `Static Analysis` (everything `check` runs except the tests, plus
  # `bootJar`), the `Tests` shards (`-PtestShard=i/n`, a fixed split of the test classes), and
  # `Quality Gate`, which verifies the coverage rules over every shard's merged JaCoCo data.
  # Together they run what `./gradlew qualityGate` runs locally. `Quality Gate` is the job to
  # require: it fails unless every other job succeeded, because a job skipped after a failure would
  # otherwise count as passed.
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run static analysis
        run: ./gradlew --no-daemon check bootJar -x test

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: build/reports/
          if-no-files-found: ignore
          overwrite: true

  tests:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard always finishes, so one run reports every failing test.
      fail-fast: false
      # The shard count is this list's length; the Quality Gate job's TEST_SHARDS must match it.
      matrix:
        shard: [1, 2, 3]
    env:
      DOCKER_BUILDKIT: 1 # Enable Buildkit and let compose use it to speed up image building
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Testcontainers would otherwise pull these lazily, inside `:test` and on its critical path
      # (the Grafana LGTM image alone is over 3 GB unpacked). Pulled in the background instead, so
      # the downloads overlap Java and Gradle setup and compilation. The list is read from
      # TestContainerImages.kt, the one place the suite pins its images; a pull that is still
      # running when a test needs the image is simply joined by Docker, and one that failed is
      # retried by Testcontainers as before.
      - name: Pre-pull test container images
        run: |
          sed -n 's/.*const val [A-Z_]* = "\(.*\)".*/\1/p' \
            src/test/kotlin/com/finaxis/platform/TestContainerImages.kt |
            while read -r image; do
              nohup docker pull --quiet "$image" > /dev/null 2>&1 &
            done

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run tests
        run: ./gradlew --no-daemon test -PtestShard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The coverage data, and from one shard the main classes it was recorded against: JaCoCo
      # matches data to classes by a checksum of their bytecode, so verifying against these exact
      # files means no recompilation can drift from what ran.
      - name: Collect coverage data
        run: |
          mkdir -p build/shard-coverage
          cp build/jacoco/test.exec build/shard-coverage/test-${{ matrix.shard }}.exec
          if [ "${{ matrix.shard }}" = 1 ]; then
            mkdir -p build/shard-coverage/classes
            cp -r build/classes/java build/classes/kotlin build/shard-coverage/classes/
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: build/shard-coverage/
          if-no-files-found: error
          retention-days: 1
          # A re-run attempt replaces its shard's data: the name is kept across attempts, and one
          # file per shard is what the Quality Gate job counts.
          overwrite: true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-shard-${{ matrix.shard }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          overwrite: true

  quality-gate:
    name: Quality Gate
    needs: [static-analysis, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require every other job to have succeeded
        run: |
          echo "static analysis: ${{ needs.static-analysis.result }}"
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.static-analysis.result }}" = success
          test "${{ needs.tests.result }}" = success

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: build/shard-coverage

      # One data file per shard, or the rules would be judged on part of the suite.
      - name: Verify coverage over every shard
        env:
          TEST_SHARDS: 3
        run: |
          found=$(find build/shard-coverage -maxdepth 1 -name 'test-*.exec' | wc -l)
          test "$found" = "$TEST_SHARDS"
          ./gradlew --no-daemon \
            jacocoTestReport jacocoTestCoverageVerification jacocoAccountingCoverageVerification \
            -PshardCoverage=build/shard-coverage

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/reports/
          if-no-files-found: ignore
          overwrite: true
