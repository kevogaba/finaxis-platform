name: Static Analysis, Qodana, and Jacoco Verification

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    name: Qodana
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: true
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: 1 # Enable Buildkit and let compose use it to speed up image building
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Testcontainers would otherwise pull these lazily, inside `:test` and on its critical path
      # (the Grafana LGTM image alone is over 3 GB unpacked). Pulled in the background instead, so
      # the downloads overlap Java and Gradle setup, compilation and static analysis. The list is
      # read from TestContainerImages.kt, the one place the suite pins its images; a pull that is
      # still running when a test needs the image is simply joined by Docker, and one that failed
      # is retried by Testcontainers as before.
      - name: Pre-pull test container images
        run: |
          sed -n 's/.*const val [A-Z_]* = "\(.*\)".*/\1/p' \
            src/test/kotlin/com/finaxis/platform/TestContainerImages.kt |
            while read -r image; do
              nohup docker pull --quiet "$image" > /dev/null 2>&1 &
            done

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version-file: '.sdkmanrc'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run quality gate
        run: ./gradlew --no-daemon qualityGate

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
