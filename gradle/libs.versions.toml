[versions]
kotlinVersion = "2.4.10"
springBootVersion = "4.1.0"
springCloudVersion = "2025.1.2"
springModulithVersion = "2.1.0"
springDependencyManagementVersion = "1.1.7"
graalVmVersion = "1.1.7"
jobrunrVersion = "8.8.0"
jooqVersion = "3.21.7"
keycloakAdminClientVersion = "26.0.12"
springDoc = "3.1.0"
sentryPluginVersion = "6.17.0"
sentryVersion = "8.52.0"
opentelemetryInstrumentationAlphaVersion = "2.30.0-alpha"
detektVersion = "2.0.0-alpha.6"
spotlessVersion = "8.9.0"
ktlintVersion = "1.8.0"
checkstyleVersion = "13.7.0"
pmdVersion = "7.25.0"
spotbugsPluginVersion = "6.5.10"
spotbugsVersion = "4.10.2"
errorPronePluginVersion = "5.1.0"
errorProneVersion = "2.50.0"
archUnitVersion = "1.5.0"
namastackVersion = "1.8.0"
bucket4jVersion = "8.19.0"
mockitoKotlinVersion = "6.3.0"
embeddedPostgresVersion = "2.2.2"
embeddedPostgresBinariesBomVersion = "18.4.0"
flywayPostgresqlVersion = "13.2.0"
postgresqlDependencyVersion = "42.7.13"


[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBootVersion" }
spring-boot-aot = { id = "org.springframework.boot.aot", version.ref = "springBootVersion" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinVersion" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalVmVersion" }
sentry-jvm = { id = "io.sentry.jvm.gradle", version.ref = "sentryPluginVersion" }
detekt = { id = "dev.detekt", version.ref = "detektVersion" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessVersion" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPluginVersion" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorPronePluginVersion" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooqVersion" }

[libraries]
jobrunr-spring-boot = { module = "org.jobrunr:jobrunr-spring-boot-4-starter", version.ref = "jobrunrVersion" }
jooq-kotlin = { module = "org.jooq:jooq-kotlin", version.ref = "jooqVersion" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooqVersion" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloakAdminClientVersion" }
springdoc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springDoc" }
springdoc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springDoc" }
springdoc-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar", version.ref = "springDoc" }
sentry-bom = { module = "io.sentry:sentry-bom", version.ref = "sentryVersion" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetryInstrumentationAlphaVersion" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorProneVersion" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archUnitVersion" }
namastack-bom = { module = "io.namastack:namastack-outbox-bom", version.ref = "namastackVersion" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4jVersion" }
bucket4j-redis-common = { module = "com.bucket4j:bucket4j_jdk17-redis-common", version.ref = "bucket4jVersion" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4jVersion" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlinVersion" }

embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embeddedPostgresVersion" }
embedded-postgres-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embeddedPostgresBinariesBomVersion" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayPostgresqlVersion" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresqlDependencyVersion" }
