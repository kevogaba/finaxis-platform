services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.28.0'
    ports:
      - '3000:3000'
      - '4317'
      - '4318:4318'
    labels:
      org.springframework.boot.ignore: true
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.6.4'
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finaxis
      KC_DB_PASSWORD: finaxis
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    # Readiness, not liveness: `start-dev --import-realm` accepts connections on 8080 well before
    # the realm import finishes, and the resource server resolves the issuer during startup, so a
    # dependent that waits only for the process exits before the realm exists.
    #
    # Spoken over bash's /dev/tcp rather than curl because the Keycloak image does not ship one.
    # The management interface serves /health/ready on 9000, which KC_HEALTH_ENABLED above turns on.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - '8080:8080'
      - '9000:9000'
    volumes:
      - './docker/keycloak/import:/opt/keycloak/data/import:ro'
    labels:
      org.springframework.boot.ignore: true
  # postgres, rabbitmq, and redis are deliberately NOT labelled
  # `org.springframework.boot.ignore`. Spring Boot's Docker Compose support detects them and
  # derives the local datasource, AMQP, and Redis connection details from the running containers,
  # which keeps local development in step with whatever this file declares.
  #
  # Consequence, worth knowing before you debug it: while these containers are running, the
  # compose-derived details take precedence over `spring.datasource.url`, `spring.rabbitmq.*`, and
  # `spring.data.redis.*`, so the FINAXIS_* environment variables are effectively no-ops LOCALLY.
  # They are authoritative in staging and production, where `spring-boot-docker-compose` is a
  # `developmentOnly` dependency and is not on the classpath at all.
  #
  # This is why POSTGRES_DB below must match the database name in FINAXIS_DATASOURCE_URL: the two
  # paths have to agree, or local development and deployed environments target different databases.
  postgres:
    image: 'postgres:18.4'
    environment:
      # The application database, created by the image at first start. Must stay in step with the
      # database name in FINAXIS_DATASOURCE_URL (see src/main/resources/application.yaml).
      # docker/postgres/initdb only adds the extra Keycloak database.
      POSTGRES_DB: platform
      POSTGRES_PASSWORD: finaxis
      POSTGRES_USER: finaxis
    ports:
      - '5433:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
      - './docker/postgres/initdb:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finaxis -d platform']
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: 'rabbitmq:4.3.2-management'
    environment:
      RABBITMQ_DEFAULT_PASS: finaxis
      RABBITMQ_DEFAULT_USER: finaxis
    ports:
      - '5673:5672'
      - '15672:15672'
  redis:
    image: 'redis:8.8.0'
    ports:
      - '6379:6379'
  mailpit:
    image: 'axllent/mailpit:v1.27.5'
    ports:
      - '1025:1025'
      - '8025:8025'
    labels:
      org.springframework.boot.ignore: true
  # Either image built by `./gradlew bootBuildImage`, wired to the services above so the container
  # can be smoke-tested against the same local infrastructure `bootRun` uses. It sits behind the
  # `image` profile so `docker compose up` still starts infrastructure only:
  #
  #   docker compose --profile image up platform                                  # native
  #   FINAXIS_IMAGE=ghcr.io/kevogaba/finaxis-platform:0.0.1-SNAPSHOT-jvm \
  #     docker compose --profile image up platform                                # JVM
  #   ./scripts/local-smoke.sh
  #
  # It joins the host network rather than the compose network, which is what makes the smoke script
  # work unchanged: Keycloak stamps each token with the URL the caller used, so a token minted
  # through the published port carries `localhost:8080` and only an application that resolves that
  # same URL can validate it. Sharing the host network gives the container exactly the view
  # `bootRun` has, so every FINAXIS_* default in application.yaml already points at the right
  # published port and no overrides are needed. `server.port` still publishes the API on 8081.
  #
  # Host networking is native on Linux; Docker Desktop needs it enabled under Resources > Network.
  #
  # `spring-boot-docker-compose` is a developmentOnly dependency and is not in the native image, so
  # unlike `bootRun` this container derives nothing from compose - the FINAXIS_* variables are the
  # only configuration it has. See docs/operations/native-image-deployment.md.
  platform:
    image: '${FINAXIS_IMAGE:-ghcr.io/kevogaba/finaxis-platform:0.0.1-SNAPSHOT}'
    profiles:
      - image
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      # Everything the application resolves at startup: Redis for sessions, RabbitMQ for the
      # outbox publisher, Keycloak for OIDC issuer discovery, and an SMTP endpoint because
      # `spring-boot-starter-mail` contributes a health indicator that dials the mail host.
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    labels:
      org.springframework.boot.ignore: true

volumes:
  postgres-data:
